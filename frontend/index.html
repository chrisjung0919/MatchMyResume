<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Match My Resume</h1>

        <div id="drop-zone">
            <p>Drag & Drop Resume PDF Here</p>
        </div>

        <textarea id="job" placeholder="Paste job description..."></textarea>

        <button onclick="analyze()">Analyze</button>

        <div id="progress-container">
            <svg width="150" height="150">
                <circle cx="75" cy="75" r="65" stroke="#ddd" stroke-width="10" fill="none"/>
                <circle id="progress-circle" class="progress-circle" cx="75" cy="75" r="65"
                    stroke="#4CAF50"
                    stroke-width="10"
                    fill="none"
                    stroke-dasharray="408"
                    stroke-dashoffset="408"
                    stroke-linecap="round"/>
            </svg>
            <div id="score-text">0%</div>
        </div>

        <div id="result-container">
            <div id="verdict" class="verdict-box"></div>
            
            <h2>Analysis</h2>
            <div id="result"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
